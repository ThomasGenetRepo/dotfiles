# eza theme — Rose Pine Moon (matches wezterm + nvim)
# Palette: base #232136  overlay #393552  muted #6e6a86  subtle #908caa
#          text #e0def4  love #eb6f92  gold #f6c177  rose #ea9a97
#          pine #3e8fb0  foam #9ccfd8  iris #c4a7e7
# Docs: https://github.com/eza-community/eza/blob/main/man/eza_colors.5.md
colourful: true

filekinds:
  normal:        { foreground: "#e0def4" }
  directory:     { foreground: "#9ccfd8", is_bold: true }
  symlink:       { foreground: "#c4a7e7" }
  pipe:          { foreground: "#f6c177" }
  block_device:  { foreground: "#eb6f92" }
  char_device:   { foreground: "#eb6f92" }
  socket:        { foreground: "#eb6f92" }
  special:       { foreground: "#f6c177" }
  executable:    { foreground: "#f6c177", is_bold: true }
  mount_point:   { foreground: "#3e8fb0" }

perms:
  user_read:           { foreground: "#e0def4" }
  user_write:          { foreground: "#f6c177" }
  user_execute_file:   { foreground: "#eb6f92" }
  user_execute_other:  { foreground: "#eb6f92" }
  group_read:          { foreground: "#908caa" }
  group_write:         { foreground: "#f6c177" }
  group_execute:       { foreground: "#eb6f92" }
  other_read:          { foreground: "#908caa" }
  other_write:         { foreground: "#f6c177" }
  other_execute:       { foreground: "#eb6f92" }
  special_user_file:   { foreground: "#c4a7e7" }
  special_other:       { foreground: "#6e6a86" }
  attribute:           { foreground: "#6e6a86" }

size:
  major:        { foreground: "#e0def4" }
  minor:        { foreground: "#9ccfd8" }
  number_byte:  { foreground: "#e0def4" }
  number_kilo:  { foreground: "#908caa" }
  number_mega:  { foreground: "#3e8fb0" }
  number_giga:  { foreground: "#c4a7e7" }
  number_huge:  { foreground: "#eb6f92" }
  unit_byte:    { foreground: "#6e6a86" }
  unit_kilo:    { foreground: "#6e6a86" }
  unit_mega:    { foreground: "#6e6a86" }
  unit_giga:    { foreground: "#6e6a86" }
  unit_huge:    { foreground: "#eb6f92" }

users:
  user_you:     { foreground: "#ea9a97" }
  user_root:    { foreground: "#eb6f92" }
  user_other:   { foreground: "#c4a7e7" }
  group_yours:  { foreground: "#908caa" }
  group_root:   { foreground: "#eb6f92" }
  group_other:  { foreground: "#6e6a86" }

links:
  normal:           { foreground: "#c4a7e7" }
  multi_link_file:  { foreground: "#f6c177" }

git:
  new:         { foreground: "#9ccfd8" }
  modified:    { foreground: "#f6c177" }
  deleted:     { foreground: "#eb6f92" }
  renamed:     { foreground: "#3e8fb0" }
  typechange:  { foreground: "#c4a7e7" }
  ignored:     { foreground: "#6e6a86" }
  conflicted:  { foreground: "#eb6f92" }

git_repo:
  branch_main:   { foreground: "#908caa" }
  branch_other:  { foreground: "#c4a7e7" }
  git_clean:     { foreground: "#9ccfd8" }
  git_dirty:     { foreground: "#f6c177" }

file_type:
  image:       { foreground: "#f6c177" }
  video:       { foreground: "#eb6f92" }
  music:       { foreground: "#9ccfd8" }
  lossless:    { foreground: "#9ccfd8" }
  crypto:      { foreground: "#6e6a86" }
  document:    { foreground: "#e0def4" }
  compressed:  { foreground: "#c4a7e7" }
  temp:        { foreground: "#6e6a86" }
  compiled:    { foreground: "#908caa" }
  build:       { foreground: "#f6c177" }
  source:      { foreground: "#3e8fb0" }

punctuation:          { foreground: "#6e6a86" }
date:                 { foreground: "#ea9a97" }
inode:                { foreground: "#6e6a86" }
blocks:               { foreground: "#6e6a86" }
header:               { foreground: "#908caa", is_underline: true }
octal:                { foreground: "#9ccfd8" }
flags:                { foreground: "#6e6a86" }
symlink_path:         { foreground: "#c4a7e7" }
control_char:         { foreground: "#eb6f92" }
broken_symlink:       { foreground: "#eb6f92" }
broken_path_overlay:  { foreground: "#eb6f92" }
