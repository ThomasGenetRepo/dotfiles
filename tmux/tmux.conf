# Remap prefix from Ctrl-b to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g renumber-windows on

# Reduce delay for escape-key sequences.
# Helps Neovim feel snappier inside tmux.
set -g escape-time 10

# Allows repeatable bindings, such as pane resize, to be repeated
# without pressing prefix each time.
set -g repeat-time 800

# Reload config with prefix + r
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Mouse support for pane resize/select
set -g mouse on

# Send copied text to the system clipboard via OSC 52
# WezTerm supports this.
set -g set-clipboard on

# Start numbering windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Bigger scrollback
set -g history-limit 10000

# tmux's own terminal type
set -g default-terminal "tmux-256color"

# Pass through modified arrow/function keys (e.g. Ctrl-Up/Down) so
# Neovim can distinguish them from plain arrow keys.
set -g xterm-keys on

# Enable true color passthrough for terminals that support it.
# WezTerm does.
set -as terminal-features ',wezterm:RGB'
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-features ',tmux-256color:RGB'

# Let terminal graphics escape sequences (Kitty/iTerm2 image protocols)
# through to WezTerm, needed for image.nvim to render images in-pane.
set -gq allow-passthrough on

# Intuitive pane splits (| and - instead of % and ")
unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

# Vim-style window ("tab") navigation: prefix + h/l instead of prefix + p/n
unbind p
unbind n
bind h previous-window
bind l next-window

# Prefix + H/J/K/L resize panes repeatedly
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt + h/j/k/l raw tmux pane navigation, no prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# --- Status bar ---
# Placed on top so it doesn't collide with nvim's own status/command line
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#191724,fg=#908caa"

set -g status-left-length 30
set -g status-left "#[bg=#26233a,fg=#e0def4,bold] #S #[bg=#191724,fg=#191724]"

set -g status-right-length 90
set -g status-right "#{prefix_highlight}#[fg=#908caa] #{cpu_icon} #{cpu_percentage} #{ram_icon} #{ram_percentage} #[fg=#6e6a86]│#[fg=#908caa] #{net_speed} #[fg=#6e6a86]│#[fg=#908caa] %Y-%m-%d %H:%M "

# Tighten net-speed padding
set -g @net_speed_format "↓%5s ↑%5s"

setw -g window-status-format "#[fg=#6e6a86] #I:#W "
setw -g window-status-current-format "#[bg=#26233a,fg=#e0def4,bold] #I:#W "

# Pane borders
set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=#191724,bg=#c4a7e7,bold],#[fg=#6e6a86]} #{pane_index}:#{pane_current_command}:#{b:pane_current_path} #[default]"

set -g pane-border-style "fg=#26233a"
set -g pane-active-border-style "fg=#c4a7e7"

# Let full-screen TUIs handle colors
set -g window-style "default"
set -g window-active-style "default"

# --- Tree / Selection Mode Formatting ---
# Collapse tree by default, zoom to fit screen (-sZ)
bind w choose-tree -sZ

# Apply Rose Pine highlight colors to the selection menu.
# NOTE: mode-style also colors mouse/copy-mode text selection, so this
# uses Highlight Med (#403d52) for clear contrast against the base bg.
set -g mode-style "bg=#403d52,fg=#e0def4"
set -g display-panes-colour "#6e6a86"
set -g display-panes-active-colour "#c4a7e7"

# Rename current pane
bind P command-prompt -p "pane title:" "select-pane -T '%%'"

# Show pane numbers
bind q display-panes

# Tell terminal apps when their pane gains/loses focus.
set -g focus-events on

# --- Plugins ---
# TPM itself
set -g @plugin 'tmux-plugins/tpm'

# Seamless vim-style pane navigation with Ctrl-h/j/k/l, no prefix needed.
# Also integrates with Neovim splits if you install the matching
# christoomey/vim-tmux-navigator plugin on the nvim side.
set -g @plugin 'christoomey/vim-tmux-navigator'

# tmux-fzg for easy navigation
set -g @plugin 'sainnhe/tmux-fzf'

# Visual indicator in the status bar when prefix (Ctrl-a) is active
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @prefix_highlight_fg '#191724'
set -g @prefix_highlight_bg '#c4a7e7'

# CPU + RAM in the status bar
set -g @plugin 'tmux-plugins/tmux-cpu'

# RAM gets distinct icons
set -g @ram_low_icon "░"
set -g @ram_medium_icon "▒"
set -g @ram_high_icon "▓"

# Network up/down speed in the status bar
set -g @plugin 'tmux-plugins/tmux-net-speed'
set -g @net_speed_interfaces "eth0"

# --- tmux-fzf configuration ---
# Match fzf popup layout and size
# Keep the full tmux-fzf action menu on Shift+F so it doesn't clobber the
# direct f/s binds below (the plugin rebinds LAUNCH_KEY when it loads).
TMUX_FZF_LAUNCH_KEY="F"
# NOTE: no quotes/spaces inside individual options -- the plugin's main.sh
# (the F menu) expands $TMUX_FZF_OPTIONS without eval, so a quoted value
# with a space (e.g. --prompt='󰍉 ') word-splits and fzf dies silently.
TMUX_FZF_OPTIONS="-p 80%,60% --prompt=󰍉 --border=rounded"

# Direct keybinds for fast switching
# Ctrl-a + f -> Fuzzy find windows
bind-key "f" run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/window.sh switch"

# Ctrl-a + s -> Fuzzy find sessions
bind-key "s" run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/session.sh switch"

# --- Session persistence ---
# On WSL2 a Windows shutdown (or `wsl --shutdown`) destroys the VM, so the
# tmux server dies with it. resurrect writes the session layout to
# ~/.local/share/tmux/resurrect/ so it survives that. (It only falls back to
# the legacy ~/.tmux/resurrect/ if that directory already exists.)
set -g @plugin 'tmux-plugins/tmux-resurrect'

# prefix + Ctrl-s -> save, prefix + Ctrl-r -> restore (resurrect's defaults).

# Restore scrollback, not just the layout.
set -g @resurrect-capture-pane-contents 'on'

# Relaunch nvim via `nvim -S` when the pane's cwd has a Session.vim, so
# buffers/splits come back too. Requires vim-obsession on the nvim side to
# keep Session.vim current -- see nvim/lua/plugins/tools.lua.
set -g @resurrect-strategy-nvim 'session'

# Processes safe to relaunch on restore. The default whitelist is
# vi/vim/nvim/emacs/man/less/more/tail/top/htop/irssi/weechat/mutt; this
# extends it (leading ~ = match the command even with arguments).
set -g @resurrect-processes 'ssh psql lazygit btop "~watch"'

# Autosave every 15 min and auto-restore when the tmux server starts, so
# Monday you just run `tmux` and it's all back.
# NOTE: continuum must be the LAST plugin declared -- it appends to
# status-right to publish its save timestamp, and anything declared after
# it can clobber that.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (must stay at the very bottom of the file)
run '~/.tmux/plugins/tpm/tpm'
